name: odoo-dev

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - ..:/workspace/odoo
      - odoo-data:/var/lib/odoo
    working_dir: /workspace/odoo
    command:
      - ./odoo-bin
      - -c
      - docker/odoo-docker.conf
      - -d
      - odoo_dev
      - --dev=xml,qweb,assets

volumes:
  db-data:
  odoo-data:
